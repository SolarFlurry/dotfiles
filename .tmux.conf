set -g default-terminal "xterm-ghostty"

set-option -gas terminal-overrides "*:Tc" # true color support
set-option -gas terminal-overrides "*:RGB" # true color support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

# prefix (option+i)
unbind C-b
set-option -g prefix M-i
bind-key M-i send-prefix

set -g buffer-limit 1

# reload
bind r source-file ~/.tmux.conf

# panes
bind -n M-d split-window -h -c "#{pane_current_path}"
bind -n M-D split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# switching panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-w if-shell '[ $(tmux display-message -p "#{session_windows}") -eq 1 ] && [ $(tmux display-message -p "#{window_panes}") -eq 1 ]' 'detach-client' 'kill-pane'

set -g mouse on

setw -g mode-keys vi

unbind -T copy-mode-vi MouseDragEnd1Pane

bind-key -T copy-mode-vi y send-keys -X copy-pipe "pbcopy -selection clipboard -in"

bind-key -T copy-mode-vi DoubleClick1Pane \
    select-pane \; \
    send-keys -X select-word

set-option -g allow-rename off

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'bg=#5b6078 fg=default'

# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position top
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=#c6a0f6 bg=default'
set -g status-right '#[fg=#181926 bg=#c6a0f6]   %Y-%m-%d %H:%M:%S '
set -g status-right-length 50

setw -g window-status-separator ''

setw -g window-status-current-style 'fg=blue bg=default bold'
setw -g window-status-current-format '#{?#I,}#[fg=#181926 bg=blue] #I #W #F #[fg=blue bg=default]'

setw -g window-status-style 'fg=#181926 bg=default'
setw -g window-status-format '#{?#I,}#[fg=blue bg=#181926] #I #[fg=white]#W #[fg=yellow]#F #[fg=#181926 bg=default]'

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'bg=#181926 fg=white'
